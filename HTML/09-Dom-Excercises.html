<!DOCTYPE html>
<html>
    <head>
        <title>Dom</title>
    </head>
    <body>
       <button> 9a</button>
       <button class="js-second-button"></button>

       <input type="text" placeholder="Name" id="name" name="name-box" class="js-input" onkeydown="handle(event);">
       <button class="js-submit" onclick="show();"> Submit </button>
       <p class="js-name"></p>
        <script>
            console.log(document.querySelector("button"));
            document.querySelector('.js-second-button').textContent = '9b done';

            function handle(event){

                if(event.key == 'Enter'){

                    show()
                }
            }
            
            function show(){

            const value = document.querySelector('.js-input');
            document.querySelector('.js-name').innerHTML = value.value; }

            
        </script>
    </body>
</html>
