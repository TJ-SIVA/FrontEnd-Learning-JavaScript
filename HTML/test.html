<!DOCTYPE html>
<html>
<head>
  <title>DOM Challenge</title>
  <style>
    .active {
      background-color: #333;
      color: white;
    }
  </style>
</head>
<body>

  <button id="gamingBtn">Gaming</button>
  <button id="musicBtn">Music</button>

  <p id="result"></p>

  <script>
    const gamingBtn = document.getElementById('gamingBtn');
    const musicBtn = document.getElementById('musicBtn');
    const result = document.getElementById('result');

    gamingBtn.onclick = function() {
      gamingBtn.classList.add('active');
      musicBtn.classList.remove('active');
      result.textContent = "Selected: Gaming";
    };

    musicBtn.onclick = function() {
      musicBtn.classList.add('active');
      gamingBtn.classList.remove('active');
      result.textContent = "Selected: Music";
    };
  </script>

</body>
</html>
