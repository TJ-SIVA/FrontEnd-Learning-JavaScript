<!DOCTYPE html>
<html>
    <head>
        <title>buttons</title>

        <style>
            p.{

                margin-bottom: 10px;
                font-size: 20px;

            }

            .numbers{

                padding: 4px 5px;
                border: none;
                color: azure;
                background-color: black;
                border-radius: 4px;
                 transition: 0.15 all;
            }

            .add,.buy{

                color: black;
                background-color: yellow;
                border: none;
                padding: 10px 16px;
                border-radius: 8px;
                transition: 0.15 all;
            }

            .buy{

                background-color: orangered;
            }

            .add:hover,.buy:hover ,.numbers:hover{
                opacity: 0.80;
            }

            .add:active,.buy:active ,.numbers:active{

                transform: translateY(-2px);
            }

            .add-buttons, .remove-buttons{

                margin-bottom: 10px;
                margin-top: 10px;
            }
            
        </style>
    </head>
    <body>
        <main>
            <section>
                <p> Adults Plain Cotton T-shirt</p>
                <p> Price: &dollar;7.99</p>

                <div class="add-buttons"></div>
                    <button class="add" 
                    
                    onclick=" 
                        cartQuantity +=1;
                        console.log(`Cart Quantity:${cartQuantity}`);
                    
                    ">
                        
                        Add to cart </button>

                    
                    <button class="numbers" 
                        onclick=" cartQuantity +=2 ;
                        console.log(`Cart Quantity:${cartQuantity}`);
                        "       
                    > +2 </button>
                    <button class="numbers"
                            onclick=" cartQuantity +=3 ;
                        console.log(`Cart Quantity:${cartQuantity}`);"
                        
                        > +3 </button>
                    <button class="numbers"
                        onclick=" cartQuantity +=4 ;
                        console.log(`Cart Quantity:${cartQuantity}`);""
                    
                    > +4 </button>
                    <button class="numbers"
                        onclick=" cartQuantity +=4 ;
                        console.log(`Cart Quantity:${cartQuantity}`);""
                    
                    > +5 </button>
                </div>

                <div class="remove-buttons">

                    <button class="add" 
                       onclick=" 
                        cartQuantity -=1;
                        console.log(`Cart Quantity:${cartQuantity}`);
                    
                    ""> remove </button>

                        <button class="numbers"
                        onclick=" 
                        cartQuantity -=2;
                        console.log(`Cart Quantity:${cartQuantity}`);
                    
                    "> -2 </button>
                        <button class="numbers"
                           onclick=" 
                        cartQuantity -=3;
                        console.log(`Cart Quantity:${cartQuantity}`);
                    
                    "> -3 </button>

                        <button class="numbers"
                           onclick=" 
                        cartQuantity -=4;
                        console.log(`Cart Quantity:${cartQuantity}`);
                    
                    "> -4 </button>


                        <button class="numbers"
                           onclick=" 
                        cartQuantity -=5;
                        console.log(`Cart Quantity:${cartQuantity}`);
                    
                    "> -5 </button>
                </div>
               

                <button  
                
                onclick=" 
                        cartQuantity = 0;
                        console.log(`Cart Quantity:${cartQuantity}`);
                    
                    " class="buy"> Empty cart </button>


            </section>
        </main>

        <script>
            let cartQuantity = 0;
            console.log(`Cart Quantity:${cartQuantity}`)
        </script>
    </body>
</html>
