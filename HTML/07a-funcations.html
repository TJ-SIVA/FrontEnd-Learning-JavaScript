<!DOCTYPE html>
<html>
    <head>
        <title>Funcations</title>
    </head>
    <body>
        <P> Funcations excersise</P>


        <script>

            function greet(name){

                if (name){
                    console.log(`Hello ${name}`)
                }

                else{

                    console.log('Hello there')
                }
            }

            greet("siva");
            greet("kumar");
            greet();

        </script>
    </body>
</html>
