<!DOCTYPE html>

<html>
    <head>
        <title> Rock Paper Scissors</title>
        
    </head>

    <body>

        <div class="btns-layout">
            <button class="btns" onclick="
                playGame('Rock');
                ">Rock</button>
            <button class="btns" onclick="
                playGame('Paper');
            ">Paper</button>
            <button class="btns" onclick="
                playGame('Scissors');
            ">Scissors</button>
            <p class="js-result"></p>
            <p class="js-move"></p>
            <p class="js-score"></p>
            <button class="btns" onclick="

            localStorage.removeItem('score');
            location.reload();

            "> Restore </button>
        </div>

        <script>

            const score = JSON.parse(localStorage.getItem('score')) || {

                Win : 0,
                Lose : 0,
                Tie : 0
            }

            const scoreElem = document.querySelector('.js-score');
            displayScore();
            


            function playGame(playerMove){
                const computerMove = pickComputerMove();

                if (playerMove === computerMove){

                    score.Tie +=1;
                     localStorage.setItem('score',JSON.stringify(score));
                     displayMove(playerMove,computerMove,"You Tie");
                     displayScore();

                }

                else if( (playerMove === 'Rock' && computerMove === 'Scissors') ||
                         (playerMove === 'Scissors' && computerMove === 'Paper') ||
                        (playerMove === 'Paper' && computerMove === 'Rock') ){

                            score.Win +=1;

                            localStorage.setItem('score',JSON.stringify(score));
                            displayMove(playerMove,computerMove,"You Win");
                            displayScore();

                }

                else{
                     score.Lose +=1
                    localStorage.setItem('score',JSON.stringify(score));
                    displayMove(playerMove,computerMove,"You Lose");
                    displayScore();
                }

            }

            function displayScore(){

                scoreElem.innerHTML = `Wins: ${score.Win} Losses:${score.Lose} Ties:${score.Tie}`;


            }

            function displayMove(playerMove,computerMove,result){

                document.querySelector(".js-result").innerHTML = result
                document.querySelector(".js-move").innerHTML = `you choose "${playerMove}" and computer choose "${computerMove}".`


            }

            
            

            function pickComputerMove(){
                

                const value = Math.random();

                if (value >= 0 && value < 1/3){

                    return 'Rock';
                }

                else if(value >= 1/3 && value< 2/3){
                    
                    return 'Paper';
                }

                else{

                    return 'Scissors'
                }
            }
        </script>
    </body>
</html>
