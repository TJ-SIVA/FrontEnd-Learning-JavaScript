<!DOCTYPE html>
<html>
    <head>
        <title> if else</title>
    </head>

    <body>
        
        <script>
            const now = new Date();
            const hour = now.getHours();

            const name = "Sivakumar Devaraj"

            if(hour >= 6 && hour<=12){

                console.log(`Good Morning ${name} !!`);
            }

            else if(hour >=13 && hour<=17){

                console.log(`Good Afternoon ${name} !!`);
            }

            else{

                console.log(`Good night ${name} !!`);
            }
            
        </script>
    </body>
</html>
