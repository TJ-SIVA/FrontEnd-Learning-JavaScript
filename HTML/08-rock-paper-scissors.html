<!DOCTYPE html>

<html>
    <head>
        <title> Rock Paper Scissors</title>
        
    </head>

    <body>

        <div class="btns-layout">
            <button class="btns" onclick="
                playGame('Rock');
                ">Rock</button>
            <button class="btns" onclick="
                playGame('Paper');
            ">Paper</button>
            <button class="btns" onclick="
                playGame('Scissors');
            ">Scissors</button>
        </div>

        <script>

            const score = {

                Win : 0,
                Lose : 0,
                Tie : 0
            }

            function playGame(playerMove){
                const computerMove = pickComputerMove();
                if (playerMove === computerMove){

                    score.Tie +=1;
                    alert(`you choose ${playerMove} and computer choose ${computerMove}. "Tie" 
                            Wins: ${score.Win} Losses:${score.Lose} Ties:${score.Tie}`);
                }

                else if( (playerMove === 'Rock' && computerMove === 'Scissors') ||
                         (playerMove === 'Scissors' && computerMove === 'Paper') ||
                        (playerMove === 'Paper' && computerMove === 'Rock') ){

                            score.Win +=1;

                           alert(`you choose ${playerMove} and computer choose ${computerMove}. "You Win"
                                     Wins: ${score.Win} Losses:${score.Lose} Ties:${score.Tie}`);

                }

                else{
                     score.Lose +=1
                    alert(`you choose ${playerMove} and computer choose ${computerMove}. "You Lose"
                             Wins: ${score.Win} Losses:${score.Lose} Ties:${score.Tie}`);
                }
            }

            function pickComputerMove(){
                

                const value = Math.random();

                if (value >= 0 && value < 1/3){

                    return 'Rock';
                }

                else if(value >= 1/3 && value< 2/3){
                    
                    return 'Paper';
                }

                else{

                    return 'Scissors'
                }
            }
        </script>
    </body>
</html>
